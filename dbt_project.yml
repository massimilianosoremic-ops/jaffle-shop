config-version: 2

name: "jaffle_shop"
version: "3.0.0"
require-dbt-version: ">=2.0.0"

dbt-cloud:
  project-id: 275557 # Put your project id here

profile: default # Put your profile here

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["data-tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  jaffle_shop:
    +schema: dbt_msoremic
    jaffle-data:
      +enabled: true
      +schema: dbt_msoremic

models:
  jaffle_shop:
    staging:
      +materialized: view
    marts:
      +materialized: table